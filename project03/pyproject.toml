[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "diplo_graph03"
version = "0.0.1"
description = "Projeto 3 da matéria NLP da Unicamp 2s2026."
authors = [
  { name = "Diplotokens" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]

# torch fica de fora de propósito: no Windows, o pip instala a versão só de CPU.
# Instale à parte, conforme a sua GPU (https://pytorch.org/get-started/locally/).

dependencies = [
    "ipython",
    "jupyterlab",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "python-dotenv",
    "pytest",
    "pyyaml",
    "requests",
    "ruff",
    "scikit-learn",
    "scipy",
    "duckdb",
    "tqdm",
    "transformers",
]
requires-python = ">=3.11"


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
src = ["diplo_graph03"]
include = ["pyproject.toml", "diplo_graph03/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["diplo_graph03"]
force-sort-within-sections = true