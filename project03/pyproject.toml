[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "diplo_graph03"
version = "0.0.1"
description = "Projeto 3 da mat\u00e9ria NLP da Unicamp 2s2026."
authors = [
  { name = "Diplotokens" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipython",
    "jupyterlab",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "python-dotenv",
    "ruff",
    "scikit-learn",
]
requires-python = "~=>3.11.0"


[tool.ruff]
line-length = 99
src = ["diplo_graph03"]
include = ["pyproject.toml", "diplo_graph03/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["diplo_graph03"]
force-sort-within-sections = true

